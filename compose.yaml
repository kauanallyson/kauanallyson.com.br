# Production stack: Traefik (HTTPS via Let's Encrypt) + the portfolio.
# On the server: copy deploy/.env.example to .env, fill it in, then
#   docker compose up -d --build

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  portfolio:
    build: .
    image: kauanallyson-portfolio:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=le
      - traefik.http.routers.portfolio.middlewares=www-to-apex
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.services.portfolio.loadbalancer.server.port=3000

volumes:
  letsencrypt:
